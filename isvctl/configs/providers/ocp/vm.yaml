# OpenShift Virtualization (KubeVirt) VM validation configuration
#
# Imports validations from the provider-agnostic VM canonical config (``tests/vm.yaml``).
# This file replaces the canonical step list with OCP stubs (``oc``/``kubectl``, ``virtctl``).
#
# Steps:
#   1. launch_instance - kubectl/oc apply VM manifest (required), virtctl start, wait Running, SSH (setup)
#   2. list_instances - List VMIs in namespace (test)
#   3. verify_tags - Labels/annotations check (test)
#   4. stop_instance / start_instance / reboot_instance - Lifecycle (test)
#   5. serial_console - Console output (test)
#   6. deploy_nim - NIM via SSH (test)
#
# Set ``vm_manifest`` to the path of your ``VirtualMachine`` YAML (required); passed as ``--manifest``.
#
# Usage:
#   uv run isvctl test run -f isvctl/configs/providers/ocp/vm.yaml

import:
  - ../../tests/vm.yaml

version: "1.0"

commands:
  vm:
    phases: ["setup", "test", "teardown"]
    steps:
      - name: launch_instance
        phase: setup
        command: "python3 ../../stubs/ocp/vm/launch_instance.py"
        args:
          - "--vpc-id"
          - "{{vpc_id}}"
          - "--instance-id"
          - "{{instance_id}}"
          - "--manifest"
          - "{{vm_manifest}}"
          - "--key-file"
          - "{{key_file}}"
          - "--ssh-user"
          - "{{ssh_user}}"
          - "--ssh-port"
          - "{{ssh_port}}"
        timeout: 900

      - name: list_instances
        phase: test
        command: "python3 ../../stubs/ocp/vm/list_instances.py"
        args:
          - "--vpc-id"
          - "{{steps.launch_instance.vpc_id}}"
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
        timeout: 120

      - name: verify_tags
        phase: test
        command: "python3 ../../stubs/ocp/vm/describe_tags.py"
        args:
          - "--vpc-id"
          - "{{steps.launch_instance.vpc_id}}"
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
        timeout: 60

      - name: stop_instance
        phase: test
        command: "python3 ../../stubs/ocp/vm/stop_instance.py"
        args:
          - "--vpc-id"
          - "{{steps.launch_instance.vpc_id}}"
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
        timeout: 600

      - name: start_instance
        phase: test
        command: "python3 ../../stubs/ocp/vm/start_instance.py"
        args:
          - "--vpc-id"
          - "{{steps.launch_instance.vpc_id}}"
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--key-file"
          - "{{steps.launch_instance.key_file}}"
          - "--ssh-user"
          - "{{ssh_user}}"
          - "--ssh-port"
          - "{{ssh_port}}"
        timeout: 60

      - name: reboot_instance
        phase: test
        command: "python3 ../../stubs/ocp/vm/reboot_instance.py"
        args:
          - "--vpc-id"
          - "{{steps.launch_instance.vpc_id}}"
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--key-file"
          - "{{steps.launch_instance.key_file}}"
          - "--ssh-user"
          - "{{ssh_user}}"
          - "--ssh-port"
          - "{{ssh_port}}"
        timeout: 120

      - name: serial_console
        phase: test
        command: "python3 ../../stubs/ocp/vm/serial_console.py"
        args:
          - "--vpc-id"
          - "{{steps.launch_instance.vpc_id}}"
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
        timeout: 60

      # Shared: Deploy NIM container via SSH (paramiko)
      # Uses post-reboot IP/key since reboot may reassign the public IP
      # - name: deploy_nim
      #   phase: test
      #   command: "python3 ../../stubs/common/deploy_nim.py"
      #   args:
      #     - "--host"
      #     - "{{ssh_host}}"
      #     - "--port"
      #     - "{{ssh_port}}"
      #     - "--key-file"
      #     - "{{steps.launch_instance.key_file}}"
      #   timeout: 1800

      # # Shared: Teardown NIM container via SSH (paramiko)
      # # Uses post-reboot IP/key to match what deploy_nim used
      # - name: teardown_nim
      #   phase: teardown
      #   command: "python3 ../../stubs/common/teardown_nim.py"
      #   args:
      #     - "--host"
      #     - "{{steps.reboot_instance.public_ip}}"
      #     - "--key-file"
      #     - "{{steps.reboot_instance.key_file}}"
      #   timeout: 120

      - name: teardown
        phase: teardown
        command: "python3 ../../stubs/ocp/vm/teardown.py"
        args:
          - "--vpc-id"
          - "{{steps.launch_instance.vpc_id}}"
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "{{teardown_flag}}"
        timeout: 600

tests:
  cluster_name: "ocp-vm-validation"
  description: "OCP VM (OpenShift Virtualization) validation tests"

  validations:
    cloud_init:
      step: launch_instance
      checks:
        CloudInitCheck:
          metadata_url: "none"

  settings:
    vpc_id: test-namespace
    instance_id: test-vm
    region: ""
    # Required: path to VirtualMachine manifest for launch_instance (kubectl/oc apply -f).
    vm_manifest: ""
    # deploy_nim / settings: SSH target on the runner (stubs use port-forward to the guest).
    ssh_host: localhost
    # Remote sshd port on the virt-launcher pod for `oc port-forward … :PORT`.
    ssh_port: 22
    key_file: ~/.ssh/id_rsa
    ssh_user: cloud-user
    teardown_flag: "{{(env.OCP_VM_SKIP_TEARDOWN == 'true') | ternary('--skip-destroy', '')}}"
