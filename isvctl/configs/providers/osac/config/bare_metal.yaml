# OSAC Bare Metal Validation Configuration
#
# Imports validations from the provider-agnostic bare_metal canonical suite.
# Exercises the public BareMetalInstances REST API to validate the full
# instance lifecycle: launch → describe → list → tag → stop → start →
# reboot → power-cycle → reinstall → teardown → verify.
#
# Implemented test IDs (in this file):
#   BOOT01-03: image installed (BmHostRunsExpectedImageCheck)
#   CNP01-04: topology placement (BmTopologyPlacementCheck)
#   CNP01-05: reboot (InstanceRebootCheck)
#   CNP01-06: power-cycle (InstancePowerCycleCheck)
#   CNP01-07: stop (InstanceStopCheck)
#   CNP01-08: start (InstanceStartCheck)
#   CNP05-01: instance tags (InstanceTagCheck)
#   CNP08-01: stable identifier (StableIdentifierCheck)
#   CNP08-02: stable BMH identifier across reinstall (BmIdentifierStableAfterReinstallCheck)
#   SEC21-01: sanitization confirmed (StepSuccessCheck on verify_teardown)
#   SEC21-02: disk sanitization (BmDiskSanitizationCheck)
#
# GPU-labeled checks are excluded (require direct GPU driver access).
# SSH-labeled lifecycle checks (BmHostReadyCheck, BmHostReadyAfterStartCheck,
# BmHostReadyAfterRebootCheck, BmHostReadyAfterPowerCycleCheck,
# BmHostReadyAfterReinstallCheck) are enabled — each script emits public_ip
# and key_file for paramiko; run from a host with direct BMH network access.
#
# Auth pattern: SA-token (create_sa_token) via the ephemeral tenant
# namespace provisioned by setup_tenant.py from the network domain.
# The bare metal BareMetalInstances API is the public tenant API — the
# same SA-token auth pattern as VirtualNetworks and Subnets.
#
# Usage:
#   uv run isvctl test run -f isvctl/configs/providers/osac/config/bare_metal.yaml
#
# Required Environment Variables:
#   OSAC_KEYCLOAK_URL, OSAC_KEYCLOAK_REALM
#   OSAC_ADMIN_CLIENT_ID, OSAC_ADMIN_CLIENT_SECRET  (emergency service account)
#   OSAC_FULFILLMENT_URL                             (REST gateway)
#   OSAC_FULFILLMENT_GRPC_ADDRESS                    (for tenant registration)
#   Optional: OSAC_CATALOG_ITEM (auto-discovered if unset), OSAC_VERIFY_SSL, OSAC_TENANT_NAMESPACE
#
# See osac-platform-context.md for environment variable discovery commands.

import:
  - ../../../suites/bare_metal.yaml
  - ../../../suites/network.yaml

version: "1.0"

commands:
  bare_metal:
    phases: ["setup", "test", "teardown"]
    steps:
      # =======================================================================
      # SETUP: Create ephemeral tenant (reuse network setup_tenant.py)
      # =======================================================================
      - name: setup_tenant
        phase: setup
        command: "python3 ../scripts/network/setup_tenant.py"
        args:
          - "--region"
          - "{{region}}"
        timeout: 180

      # =======================================================================
      # SETUP: Launch BareMetalInstance with SSH key + external IP
      # =======================================================================
      - name: launch_instance
        phase: setup
        command: "python3 ../scripts/bare_metal/launch_instance.py"
        args:
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
          - "--region"
          - "{{region}}"
        timeout: 1800

      # =======================================================================
      # TEST: Describe instance (state check)
      # =======================================================================
      - name: describe_instance
        phase: test
        command: "python3 ../scripts/bare_metal/describe_instance.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
          - "--key-file"
          - "{{steps.launch_instance.key_file}}"
          - "--external-ip"
          - "{{steps.launch_instance.external_ip}}"
        timeout: 60

      # =======================================================================
      # TEST: List instances and verify target is present
      # =======================================================================
      - name: list_instances
        phase: test
        command: "python3 ../scripts/bare_metal/list_instances.py"
        args:
          - "--target-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 60

      # =======================================================================
      # TEST: Verify metadata labels (CNP05-01)
      # =======================================================================
      - name: verify_tags
        phase: test
        command: "python3 ../scripts/bare_metal/verify_tags.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 60

      # =======================================================================
      # TEST: Topology placement (CNP01-04)
      # =======================================================================
      - name: topology_placement
        phase: test
        command: "python3 ../scripts/bare_metal/topology_placement.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 30

      # =======================================================================
      # TEST: Verify image installed (BOOT01-03)
      # =======================================================================
      - name: verify_image
        phase: test
        command: "python3 ../scripts/bare_metal/verify_image.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 30

      # =======================================================================
      # TEST: Query disk sanitization (SEC21-02)
      # =======================================================================
      - name: query_sanitization
        phase: test
        command: "python3 ../scripts/bare_metal/query_sanitization.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 30

      # =======================================================================
      # TEST: DHCP/IP management (IPAM01-01) — SSH probe by validation
      # =======================================================================
      - name: dhcp_ip_test
        phase: test
        command: "python3 ../scripts/bare_metal/dhcp_ip_test.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
          - "--key-file"
          - "{{steps.launch_instance.key_file}}"
          - "--external-ip"
          - "{{steps.launch_instance.external_ip}}"
        timeout: 120

      # =======================================================================
      # TEST: Network connectivity from BMI
      # =======================================================================
      - name: connectivity_test
        phase: test
        command: "python3 ../scripts/bare_metal/connectivity_test.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
          - "--key-file"
          - "{{steps.launch_instance.key_file}}"
          - "--external-ip"
          - "{{steps.launch_instance.external_ip}}"
        timeout: 120

      # =======================================================================
      # TEST: Stop instance (CNP01-07)
      # =======================================================================
      - name: stop_instance
        phase: test
        command: "python3 ../scripts/bare_metal/stop_instance.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 600

      # =======================================================================
      # TEST: Start instance (CNP01-08)
      # =======================================================================
      - name: start_instance
        phase: test
        command: "python3 ../scripts/bare_metal/start_instance.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
          - "--key-file"
          - "{{steps.launch_instance.key_file}}"
          - "--external-ip"
          - "{{steps.launch_instance.external_ip}}"
        timeout: 900

      # =======================================================================
      # TEST: Reboot instance (CNP01-05)
      # =======================================================================
      - name: reboot_instance
        phase: test
        command: "python3 ../scripts/bare_metal/reboot_instance.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
          - "--key-file"
          - "{{steps.launch_instance.key_file}}"
          - "--external-ip"
          - "{{steps.launch_instance.external_ip}}"
        timeout: 900

      # =======================================================================
      # TEST: Power-cycle instance (CNP01-06)
      # =======================================================================
      - name: power_cycle_instance
        phase: test
        command: "python3 ../scripts/bare_metal/power_cycle_instance.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
          - "--key-file"
          - "{{steps.launch_instance.key_file}}"
          - "--external-ip"
          - "{{steps.launch_instance.external_ip}}"
        timeout: 1800

      # =======================================================================
      # TEST: Reinstall instance (CNP08-02)
      # =======================================================================
      - name: reinstall_instance
        phase: test
        command: "python3 ../scripts/bare_metal/reinstall_instance.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
          - "--key-file"
          - "{{steps.launch_instance.key_file}}"
          - "--external-ip"
          - "{{steps.launch_instance.external_ip}}"
        timeout: 2400

      # =======================================================================
      # TEST: Network connectivity (NetworkConnectivityCheck)
      # =======================================================================
      - name: connectivity_test
        phase: test
        command: "python3 ../scripts/network/connectivity_test.py"
        args:
          - "--external-ip-a"
          - "{{steps.launch_instance.external_ip}}"
          - "--external-ip-b"
          - "{{steps.launch_instance.external_ip}}"
          - "--instance-a-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--instance-b-id"
          - "{{steps.launch_instance.instance_id}}"
        timeout: 30

      # =======================================================================
      # TEST: Stable private IP across stop/start (StablePrivateIpCheck / SDN11-01)
      # =======================================================================
      - name: stable_ip_test
        phase: test
        command: "python3 ../scripts/network/stable_ip_test.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--ip-before"
          - "{{steps.launch_instance.external_ip}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
          - "--verify-only"
        timeout: 60

      # =======================================================================
      # TEST: Stable egress IP (StableEgressIpCheck / DMS05-01)
      # =======================================================================
      - name: stable_egress_ip_test
        phase: test
        command: "python3 ../scripts/network/stable_egress_ip_test.py"
        args:
          - "--external-ip"
          - "{{steps.launch_instance.external_ip}}"
          - "--key-file"
          - "{{steps.launch_instance.key_file}}"
        timeout: 180

      # =======================================================================
      # TEST: Traffic flow (TrafficFlowCheck)
      # =======================================================================
      - name: traffic_validation
        phase: test
        command: "python3 ../scripts/network/traffic_validation_test.py"
        args:
          - "--external-ip-a"
          - "{{steps.launch_instance.external_ip}}"
          - "--bmh-ip-b"
          - "192.168.160.1"
          - "--key-file"
          - "{{steps.launch_instance.key_file}}"
        timeout: 180

      # =======================================================================
      # TEARDOWN: Delete instance and ephemeral tenant
      # =======================================================================
      - name: teardown
        phase: teardown
        command: "python3 ../scripts/bare_metal/teardown.py"
        args:
          - "--instance-id"
          - "{{steps.reinstall_instance.new_instance_id | default(steps.launch_instance.instance_id)}}"
          - "--tenant-name"
          - "{{steps.setup_tenant.tenant_name}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 600
        output_schema: teardown

      # =======================================================================
      # TEARDOWN: Confirm instance is gone from the API (SEC21-01)
      # =======================================================================
      - name: verify_teardown
        phase: teardown
        command: "python3 ../scripts/bare_metal/verify_teardown.py"
        args:
          - "--instance-id"
          - "{{steps.reinstall_instance.new_instance_id | default(steps.launch_instance.instance_id)}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 120

tests:
  cluster_name: "osac-bm-validation"
  description: "OSAC bare metal: instance lifecycle, power management, SSH probe"

  settings:
    region: "osac-default"

  # OSAC labels must be lowercase (Kubernetes constraint) — override the suite's
  # default required_keys which use title-case (Name, CreatedBy) for AWS-style providers.
  validations:
    tag_checks:
      checks:
        BmHostTaggedCheck:
          required_keys: ["name", "created-by"]

    # Override the reinstall stable-identifier reference to use the BMH name
    # (steps.launch_instance.bmh_id) rather than the BMI UUID
    # (steps.launch_instance.instance_id). The BMI UUID changes with each
    # reinstall; the BMH name is the stable physical identity of the host.
    reinstall_state:
      checks:
        BmIdentifierStableAfterReinstallCheck:
          reference_id: "{{steps.launch_instance.bmh_id}}"

    # Override SSH checks to use fedora user and expected OS.
    # launch_instance and describe_instance already emit public_ip and key_file;
    # start_ssh and reboot_ssh pull host/key_file from describe_instance via
    # the suite's Jinja2 references.
    # power_cycle_ssh wires host/key_file from describe_instance explicitly
    # (IP is stable via ExternalIP attachment; key does not change).
    # reinstall_ssh reads public_ip and key_file from reinstall_instance output
    # (key may differ if a fresh key was generated during reinstall).
    cloud_init:
      checks:
        BmCloudInitCheck:
          user: "fedora"
          metadata_url: "" # no cloud metadata service on OSAC bare metal

    host_os:
      checks:
        BmVcpuPinningCheck:
          user: "fedora"
        BmHostSoftwareCheck:
          user: "fedora"

    cpu_info:
      checks:
        BmCpuInfoCheck:
          user: "fedora"

    ssh:
      checks:
        BmHostReadyCheck:
          user: "fedora"
          compose:
            - ConnectivityCheck
            - OsCheck:
                expected_os: "fedora"

    start_ssh:
      checks:
        BmHostReadyAfterStartCheck:
          user: "fedora"
          compose:
            - ConnectivityCheck
            - OsCheck:
                expected_os: "fedora"

    reboot_ssh:
      checks:
        BmHostReadyAfterRebootCheck:
          user: "fedora"
          compose:
            - ConnectivityCheck
            - OsCheck:
                expected_os: "fedora"

    power_cycle_ssh:
      checks:
        BmHostReadyAfterPowerCycleCheck:
          host: "{{steps.describe_instance.public_ip}}"
          key_file: "{{steps.describe_instance.key_file}}"
          user: "fedora"
          compose:
            - ConnectivityCheck
            - OsCheck:
                expected_os: "fedora"

    reinstall_ssh:
      checks:
        BmHostReadyAfterReinstallCheck:
          user: "fedora"
          compose:
            - ConnectivityCheck
            - OsCheck:
                expected_os: "fedora"

    dhcp_ip_checks:
      checks:
        DhcpIpManagementCheck:
          user: "fedora"

    connectivity_test:
      checks:
        NetworkConnectivityCheck:
          requires: []

    stable_ip_test:
      checks:
        StablePrivateIpCheck:
          requires: []

    stable_egress_ip_test:
      checks:
        StableEgressIpCheck:
          requires: []

    traffic_validation:
      checks:
        TrafficFlowCheck:
          requires: []

  exclude:
    labels:
      - "gpu"
    tests:
      # Virtual BMHs have no NVIDIA GPU — these checks hardcode nvidia-smi/lspci probes
      - "BmHostSoftwareCheck"
      - "BmCpuInfoCheck"
      - "workload"
      - "slow"
      - "ingestion"
      - "dpu"
      - "governance"
      - "health"
      - "infiniband"
      - "breakfix"
      - "sds_controller"
      - "attestation"
      - "firmware"
      - "iam"
      - "vm"
      - "network"
