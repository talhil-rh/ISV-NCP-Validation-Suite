# OSAC Image Registry Validation Configuration
#
# Launches a VM from a golden image (DataImportCron) via OpenShift
# Virtualization (CNV). Only the launch_instance step is wired;
# other image-registry checks (CRUD, upload, BMaaS) skip as
# step_not_configured.
#
# Implemented checks:
#   BOOT01-05: VmBootedFromCustomImageCheck (VM from custom image reaches running)
#
# Usage:
#   KUBECONFIG=/path/to/kubeconfig \
#   ISVTEST_INCLUDE_UNRELEASED=1 \
#   uv run isvctl test run -f isvctl/configs/providers/osac/config/image-registry.yaml

import:
  - ../../../suites/image-registry.yaml

version: "1.0"

commands:
  image_registry:
    phases: ["test", "teardown"]
    steps:
      - name: launch_instance
        phase: test
        command: "python3 ../scripts/image_registry/launch_custom_image_vm.py"
        args:
          - "--namespace"
          - "isv-image-test"
          - "--vm-name"
          - "isv-custom-image-vm"
          - "--container-image"
          - "quay.io/containerdisks/fedora:latest"
        timeout: 600

      - name: teardown_instance
        phase: teardown
        command: "python3 ../scripts/image_registry/teardown_vm.py"
        args:
          - "--namespace"
          - "isv-image-test"
          - "--vm-name"
          - "isv-custom-image-vm"
        timeout: 120

tests:
  cluster_name: "osac-image-registry"
  description: "OSAC image registry: VM from custom image via CNV"

  settings:
    region: "osac-default"

  exclude:
    labels:
      - "ssh"
      - "bare_metal"
