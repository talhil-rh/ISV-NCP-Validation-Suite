# OSAC Image Registry Validation Configuration
#
# Validates custom OS image lifecycle via OCP ImageStreams (CRUD) and
# OpenShift Virtualization / CNV (VM launch from containerDisk).
#
# Implemented checks:
#   BOOT01-05: VmBootedFromCustomImageCheck (VM from custom image reaches running)
#   BOOT03-02: CustomOsImageCrudCheck (ImageStream get/list/create/delete)
#   N/A:       CustomOsImageDeletedCheck (image teardown)
#
# VmFromCustomImageReadyCheck is excluded (ssh label): requires SSH from the
# test runner into the CNV VM, but the pod CIDR is an OVN overlay not routable
# from the hypervisor.
#
# Usage:
#   KUBECONFIG=/path/to/kubeconfig \
#   ISVTEST_INCLUDE_UNRELEASED=1 \
#   uv run isvctl test run -f isvctl/configs/providers/osac/config/image-registry.yaml

import:
  - ../../../suites/image-registry.yaml

version: "1.0"

commands:
  image_registry:
    phases: ["setup", "test", "teardown"]
    steps:
      - name: setup_namespaces
        phase: setup
        command: "python3 ../scripts/image_registry/setup_namespaces.py"
        args:
          - "--namespaces"
          - "isv-image-crud-test"
          - "isv-image-test"
        timeout: 180

      - name: crud_image
        phase: test
        command: "python3 ../scripts/image_registry/crud_image.py"
        args:
          - "--namespace"
          - "isv-image-crud-test"
          - "--image-name"
          - "isv-test-image"
          - "--source-image"
          - "quay.io/containerdisks/fedora:latest"
        timeout: 120

      - name: launch_instance
        phase: test
        command: "python3 ../scripts/image_registry/launch_custom_image_vm.py"
        args:
          - "--namespace"
          - "isv-image-test"
          - "--vm-name"
          - "isv-custom-image-vm"
          - "--container-image"
          - "quay.io/containerdisks/fedora:latest"
        timeout: 600

      - name: teardown_image
        phase: teardown
        command: "python3 ../scripts/image_registry/teardown_image.py"
        args:
          - "--namespace"
          - "isv-image-crud-test"
        timeout: 120

      - name: teardown_instance
        phase: teardown
        command: "python3 ../scripts/image_registry/teardown_vm.py"
        args:
          - "--namespace"
          - "isv-image-test"
          - "--vm-name"
          - "isv-custom-image-vm"
        timeout: 120

tests:
  cluster_name: "osac-image-registry"
  description: "OSAC image registry: ImageStream CRUD + VM from custom image via CNV"

  settings:
    region: "osac-default"

  validations:
    vm_from_image:
      step: launch_instance
      checks:
        VmBootedFromCustomImageCheck:
          requires: []

  exclude:
    labels:
      - "ssh"
      - "bare_metal"
