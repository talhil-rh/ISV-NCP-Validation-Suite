# OSAC Control Plane Validation Configuration
#
# Imports validations from the provider-agnostic control plane canonical config.
# This file only provides OSAC-specific commands (Keycloak + Tenant CRD)
# and settings.
#
# Tests:
# - API Health: Keycloak auth and Fulfillment Service connectivity
# - Access Key Lifecycle: Keycloak OAuth2 client credentials (create/auth/disable/reject)
# - Tenant Lifecycle: OSAC Tenant CRDs (create/list/get)
#
# Usage:
#   uv run isvctl test run -f isvctl/configs/providers/osac/config/control-plane.yaml
#
# Required Environment Variables:
#   OSAC_KEYCLOAK_URL, OSAC_KEYCLOAK_REALM,
#   OSAC_KEYCLOAK_ADMIN_PASSWORD (master-realm admin password for bootstrap)
#   Optional: OSAC_KEYCLOAK_ADMIN_USER (default "admin"),
#             OSAC_FULFILLMENT_URL, OSAC_VERIFY_SSL (default "true"),
#             OSAC_TENANT_NAMESPACE (default "osac-e2e-ci"),
#             ISVCTL_DEMO_MODE

import:
  - ../../../suites/control-plane.yaml

version: "1.0"

commands:
  control_plane:
    phases: ["setup", "test", "teardown"]
    steps:
      # =======================================================================
      # SETUP: Bootstrap ephemeral admin client
      # =======================================================================
      - name: bootstrap_admin
        phase: setup
        command: "python3 ../scripts/control-plane/bootstrap_admin.py"
        timeout: 60

      # =======================================================================
      # SETUP: API Health Check
      # =======================================================================
      - name: check_api
        phase: setup
        command: "python3 ../scripts/control-plane/check_api.py"
        args:
          - "--region"
          - "{{region}}"
          - "--services"
          - "{{services}}"
          - "--admin-client-id"
          - "{{steps.bootstrap_admin.admin_client_id}}"
          - "--admin-client-secret"
          - "{{steps.bootstrap_admin.admin_client_secret}}"
        sensitive_args: ["--admin-client-secret"]
        timeout: 120

      # =======================================================================
      # SETUP: Create Resources
      # =======================================================================
      - name: create_access_key
        phase: setup
        command: "python3 ../scripts/control-plane/create_access_key.py"
        args:
          - "--region"
          - "{{region}}"
          - "--admin-client-id"
          - "{{steps.bootstrap_admin.admin_client_id}}"
          - "--admin-client-secret"
          - "{{steps.bootstrap_admin.admin_client_secret}}"
        sensitive_args: ["--admin-client-secret"]
        timeout: 60

      - name: create_tenant
        phase: setup
        command: "python3 ../scripts/control-plane/create_tenant.py"
        args: ["--region", "{{region}}"]
        timeout: 60

      # =======================================================================
      # TEST: Access Key Lifecycle
      # =======================================================================
      - name: test_access_key
        phase: test
        command: "python3 ../scripts/control-plane/test_access_key.py"
        args:
          - "--access-key-id"
          - "{{steps.create_access_key.access_key_id}}"
          - "--secret-access-key"
          - "{{steps.create_access_key.secret_access_key}}"
          - "--region"
          - "{{region}}"
        sensitive_args: ["--secret-access-key"]
        timeout: 120

      - name: disable_access_key
        phase: test
        command: "python3 ../scripts/control-plane/disable_access_key.py"
        args:
          - "--username"
          - "{{steps.create_access_key.username}}"
          - "--access-key-id"
          - "{{steps.create_access_key.access_key_id}}"
          - "--admin-client-id"
          - "{{steps.bootstrap_admin.admin_client_id}}"
          - "--admin-client-secret"
          - "{{steps.bootstrap_admin.admin_client_secret}}"
        sensitive_args: ["--admin-client-secret"]
        timeout: 60

      - name: verify_key_rejected
        phase: test
        command: "python3 ../scripts/control-plane/verify_key_rejected.py"
        args:
          - "--access-key-id"
          - "{{steps.create_access_key.access_key_id}}"
          - "--secret-access-key"
          - "{{steps.create_access_key.secret_access_key}}"
          - "--region"
          - "{{region}}"
        sensitive_args: ["--secret-access-key"]
        timeout: 120

      # =======================================================================
      # TEST: Tenant Lifecycle
      # =======================================================================
      - name: list_tenants
        phase: test
        command: "python3 ../scripts/control-plane/list_tenants.py"
        args:
          - "--region"
          - "{{region}}"
          - "--group-name"
          - "{{steps.create_tenant.tenant_name}}"
        timeout: 60

      - name: get_tenant
        phase: test
        command: "python3 ../scripts/control-plane/get_tenant.py"
        args:
          - "--group-name"
          - "{{steps.create_tenant.tenant_name}}"
          - "--region"
          - "{{region}}"
        timeout: 60

      # =======================================================================
      # TEARDOWN: Cleanup Resources
      # =======================================================================
      - name: delete_access_key
        phase: teardown
        command: "python3 ../scripts/control-plane/delete_access_key.py"
        args:
          - "--username"
          - "{{steps.create_access_key.username}}"
          - "--access-key-id"
          - "{{steps.create_access_key.access_key_id}}"
          - "--region"
          - "{{region}}"
          - "--admin-client-id"
          - "{{steps.bootstrap_admin.admin_client_id}}"
          - "--admin-client-secret"
          - "{{steps.bootstrap_admin.admin_client_secret}}"
        sensitive_args: ["--admin-client-secret"]
        timeout: 60
        output_schema: teardown

      - name: delete_tenant
        phase: teardown
        command: "python3 ../scripts/control-plane/delete_tenant.py"
        args:
          - "--group-name"
          - "{{steps.create_tenant.tenant_name}}"
          - "--region"
          - "{{region}}"
        timeout: 60
        output_schema: teardown

      - name: teardown_admin
        phase: teardown
        command: "python3 ../scripts/control-plane/teardown_admin.py"
        args:
          - "--admin-client-id"
          - "{{steps.bootstrap_admin.admin_client_id}}"
          - "--admin-client-uuid"
          - "{{steps.bootstrap_admin.admin_client_uuid}}"
        timeout: 60
        output_schema: teardown

tests:
  cluster_name: "osac-control-plane-validation"
  description: "OSAC control plane: API health, access key lifecycle, tenant lifecycle"

  settings:
    region: "osac-default"
    services: "fulfillment,keycloak"
