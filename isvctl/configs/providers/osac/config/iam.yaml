# OSAC IAM Validation Configuration
#
# Validates IAM credential lifecycle on OSAC: creates an ephemeral Keycloak
# client (the "IAM user"), verifies its credentials can authenticate and reach
# an authorized API resource, then deletes it.
#
# Maps:
#   create_user   → create a Keycloak service-account client (access key)
#   test_credentials → identity probe (client_credentials grant) +
#                       access probe (Keycloak userinfo endpoint)
#   teardown      → delete the ephemeral client
#
# Usage:
#   uv run isvctl test run -f isvctl/configs/providers/osac/config/iam.yaml
#
# Required Environment Variables:
#   OSAC_KEYCLOAK_URL, OSAC_KEYCLOAK_REALM,
#   OSAC_ADMIN_CLIENT_ID, OSAC_ADMIN_CLIENT_SECRET,
#   Optional: OSAC_VERIFY_SSL (default "true"), ISVCTL_DEMO_MODE

import:
  - ../../../suites/iam.yaml

version: "1.0"

commands:
  iam:
    phases: ["setup", "test", "teardown"]
    steps:
      # =====================================================================
      # SETUP: Create ephemeral Keycloak client (IAM user)
      # =====================================================================
      - name: create_user
        phase: setup
        command: "python3 ../scripts/iam/create_iam_user.py"
        timeout: 60

      # =====================================================================
      # TEST: Verify credential identity + resource access
      # =====================================================================
      - name: test_credentials
        phase: test
        command: "python3 ../scripts/iam/test_iam_credentials.py"
        args:
          - "--access-key-id"
          - "{{steps.create_user.access_key_id}}"
          - "--secret-access-key"
          - "{{steps.create_user.secret_access_key}}"
        sensitive_args: ["--secret-access-key"]
        timeout: 30

      # =====================================================================
      # TEARDOWN: Delete ephemeral client
      # =====================================================================
      - name: teardown
        phase: teardown
        command: "python3 ../scripts/iam/teardown.py"
        args:
          - "--client-uuid"
          - "{{steps.create_user.client_uuid}}"
        timeout: 30
        output_schema: teardown

tests:
  cluster_name: "osac-iam-validation"
  description: "OSAC IAM: credential lifecycle (create / authenticate / access / delete)"
